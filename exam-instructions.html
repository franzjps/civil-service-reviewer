<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructions · CSE Reviewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body data-page="instructions" data-nav="exams">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button id="menuToggle" class="btn btn-outline-primary d-lg-none" type="button" aria-label="Toggle navigation" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1>Examination instructions</h1>
    </header>
    <main id="main" class="content">
      <div id="instructions"><div class="text-muted">Loading…</div></div>
    </main>
  </div>

  <div class="modal fade" id="startModal" tabindex="-1" aria-labelledby="startModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="startModalTitle">Begin examination?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="startSummary"></p><p class="mb-0">The timer starts immediately and cannot be paused.</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmStart">Yes, start now</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
