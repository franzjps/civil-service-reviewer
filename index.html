<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · CSE Reviewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body data-page="dashboard">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <button id="menuToggle" class="btn btn-outline-primary d-lg-none" type="button" aria-label="Toggle navigation" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1>Dashboard</h1>
    </header>
    <main id="main" class="content">
      <section class="mb-4">
        <h2 class="h3">Welcome back!</h2>
        <p class="text-muted mb-0">Practice with timed, randomized mock exams and review your weak areas. Progress is saved only in this browser.</p>
      </section>
      <section class="row g-3 mb-4" id="stats" aria-label="Statistics"></section>
      <section class="mb-4" id="activeExam" aria-label="Start or continue an exam"></section>
      <section class="mb-4" id="flashcardSummary" aria-label="Flashcard review"></section>
      <section class="mb-4">
        <h2 class="h5">Subject categories</h2>
        <div class="row g-3" id="categories"></div>
      </section>
      <section class="card mb-4"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">Recent examinations</h2>
          <a id="recentLink" class="d-none small" href="history.html">View all</a>
        </div>
        <div id="recent"></div>
      </div></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
